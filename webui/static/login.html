<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · PE31625G24DIRA 交换机管理</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand"><div><strong id="device-model">PE31625G24DIRA</strong><small>交换机管理</small></div></div>
      <div class="login-copy">
        <h1 id="login-title">登录</h1>
      </div>
      <form id="login-form" novalidate>
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button id="login-submit" class="button primary login-submit" type="submit">登录</button>
      </form>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
